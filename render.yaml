# Render Blueprint — creates the API, its PostgreSQL database and its Redis
# (Key Value) instance, and wires DATABASE_URL / REDIS_URL between them.
# Deploy: Render Dashboard → New → Blueprint → pick this repository.

databases:
  - name: timeflow-db
    databaseName: timeflow
    plan: free

services:
  - type: keyvalue
    name: timeflow-redis
    plan: free
    # BullMQ loses jobs if Redis evicts keys, so eviction must be off.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  - type: web
    name: timeflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # `prestart` runs `prisma migrate deploy` first. Migrations run at start
    # because the private network (and so the database) is not reachable
    # during the build.
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timeflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: timeflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: ./uploads
      # Frontend URL(s) — asked for when the Blueprint is created.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # TimeFlow Assistant (the AI bot in Chat). Optional; asked for when the Blueprint is created.
      - key: GROQ_API_KEY
        sync: false
      # Voice/video calls. STUN works out of the box; add a TURN relay for
      # callers behind strict firewalls or mobile networks (see README).
      - key: CALL_TURN_URLS
        sync: false
      - key: CALL_TURN_SECRET
        sync: false
      # Recordings: Render's disk is wiped on every deploy, so store them in
      # Cloudflare R2 (see README → Recordings for the bucket and CORS setup).
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Free instances cannot open outbound SMTP ports, so mail is logged
      # rather than sent. To deliver on the free plan use an HTTPS provider:
      # resend / sendgrid / brevo plus its API key and EMAIL_FROM (a verified
      # sender). On a paid plan gmail also works: GMAIL_USER / GMAIL_APP_PASSWORD.
      # The worker needs the same values.
      - key: EMAIL_PROVIDER
        value: log
      - key: INBOUND_SYNC_ENABLED
        value: "false"
      # No worker service on the free plan, so the API sends the queued mail
      # itself. Set to false if you add the timeflow-worker service below.
      - key: RUN_WORKER_IN_API
        value: "true"

  # The background worker (emails, activity logs, inbox sync). Render has no
  # free plan for workers — uncomment to add one on the Starter plan, and set
  # RUN_WORKER_IN_API to false on timeflow-api.
  # - type: worker
  #   name: timeflow-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm ci && npm run build
  #   startCommand: npm run start:worker
  #   envVars:
  #     - fromGroup: ...  # or repeat the envVars from timeflow-api
